<script>
window.__seg=function(){
 var img=document.getElementById('s');
 if(!img.complete||!img.naturalWidth) return 'NOTREADY';
 var w=img.naturalWidth,h=img.naturalHeight;
 var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0);
 var d=x.getImageData(0,0,w,h).data;
 // column is "ink" if it has any sufficiently dark/colored pixel
 function colInk(cx){for(var y=0;y<h;y++){var i=(y*w+cx)*4;var r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];if(a>10 && (r<230||g<230||b<230))return true;}return false;}
 var runs=[],start=-1;
 for(var cx=0;cx<w;cx++){var ink=colInk(cx);if(ink&&start<0)start=cx;if(!ink&&start>=0){runs.push([start,cx-1]);start=-1;}}
 if(start>=0)runs.push([start,w-1]);
 // merge runs separated by small gaps (<40px) - keep as-is; expect ~6
 window.__runs=runs;
 // for each run, find vertical bounds and export
 function crop(x0,x1){
   var pad=12;x0=Math.max(0,x0-pad);x1=Math.min(w-1,x1+pad);
   var minY=h,maxY=0;
   for(var yy=0;yy<h;yy++)for(var xx=x0;xx<=x1;xx++){var i=(yy*w+xx)*4;if(d[i+3]>10&&(d[i]<230||d[i+1]<230||d[i+2]<230)){if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;}}
   minY=Math.max(0,minY-pad);maxY=Math.min(h-1,maxY+pad);
   var cw=x1-x0+1,ch=maxY-minY+1;
   var o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(c,x0,minY,cw,ch,0,0,cw,ch);
   return o.toDataURL('image/png').split(',')[1];
 }
 window.__imgs=runs.map(r=>crop(r[0],r[1]));
 return 'runs='+runs.length+' '+JSON.stringify(runs);
};
</script>
