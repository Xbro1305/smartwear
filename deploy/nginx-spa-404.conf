# ─────────────────────────────────────────────────────────────────────────────
# Умная Одежда — SPA на nginx с корректным HTTP 404 для несуществующих страниц.
#
# Проблема: обычный SPA-fallback `try_files $uri /index.html;` отдаёт index.html
# со статусом 200 на ЛЮБОЙ путь → поисковики видят «soft 404».
#
# Идея:
#   1. Реальные файлы и /assets/ — отдаём напрямую.
#   2. Известные роуты приложения (allowlist ниже) → index.html со статусом 200.
#   3. Всё остальное — это либо слаг категории/товара, либо мусор:
#        • спрашиваем бэкенд (auth_request → njs), существует ли такая сущность;
#        • существует  → index.html, 200;
#        • не существует → index.html, но со статусом 404 (та же React-заглушка).
#
# React-заглушка (NotFound) при этом рендерится как и раньше — меняется ТОЛЬКО
# HTTP-статус, который видит краулер. Глубокие ссылки на реальные страницы живут.
#
# ⚠️  Требует модуль njs (nginx-module-njs). Если njs нет — см. вариант B
#     в README-404.md (allowlist без проверки слагов).
# ─────────────────────────────────────────────────────────────────────────────

# Подключить njs (обычно в главном контексте nginx.conf, не в server{}):
#   load_module modules/ngx_http_js_module.so;
js_import spa from /etc/nginx/njs/slug_validate.js;

# Базовый URL API бэкенда (для проверки слагов). Поменяйте на свой прод-адрес.
# Используется во внутреннем прокси /__be/ ниже.
# Пример прод: https://maxiscomfort.ru/api/   |   тест: https://test.maxiscomfort.ru/api/

# map: является ли путь ИЗВЕСТНЫМ статическим роутом приложения (1 = да → всегда 200).
# Регэкспы проверяются сверху вниз; default 0.
map $uri $is_known_route {
    default                          0;
    ~^/$                             1;   # главная
    ~^/catalog(/|$)                  1;
    ~^/about$                        1;
    ~^/contacts$                     1;
    ~^/delivery$                     1;
    ~^/politics$                     1;
    ~^/oferta$                       1;
    ~^/stores$                       1;
    ~^/pvz$                          1;
    ~^/cart$                         1;
    ~^/search(/|$|\?)                1;
    ~^/articles(/|$)                 1;
    ~^/article/                      1;
    ~^/news(/|$)                     1;
    ~^/sign-in(/|$)                  1;
    ~^/sign-up(/|$)                  1;
    ~^/confirm-email(/|$)            1;
    ~^/profile(/|$)                  1;
    ~^/order(-history)?(/|$)         1;
    ~^/track-order$                  1;
    ~^/bookmarks$                    1;
    ~^/care$                         1;
    ~^/newsletter$                   1;
    ~^/payment-rules$                1;
    ~^/returns$                      1;
    ~^/manufacturers$                1;
    ~^/accessories(/|$)              1;
    ~^/men(/|$)                      1;
    ~^/women(/|$)                    1;
    ~^/admin(/|$)                    1;   # вся админка — всегда 200 (noindex на клиенте)
}

server {
    listen 80;
    server_name maxiscomfort.ru www.maxiscomfort.ru;   # ← поменяйте на свой домен

    root /var/www/smartwear/dist;   # ← путь к собранному фронту (vite build)
    index index.html;

    # ── Статика с хэшами — отдаём напрямую, кэшируем надолго ──
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt, sitemap.xml, favicon и прочие реальные файлы — как есть
    location = /robots.txt   { try_files $uri =404; }
    location = /sitemap.xml  { try_files $uri =404; }
    location = /favicon.svg  { try_files $uri =404; }

    # ── Основной роутинг ──
    location / {
        # Если по пути есть реальный файл — отдаём его; иначе решаем через @spa
        try_files $uri @spa;
    }

    location @spa {
        # 1) Известный статический роут приложения → SPA со статусом 200
        if ($is_known_route) {
            rewrite ^ /index.html last;
        }
        # 2) Неизвестный путь → проверяем в бэкенде, существует ли слаг
        #    (auth_request дергает njs-валидатор: товар, затем категория).
        auth_request /__validate_slug;
        error_page 401 403 = @spa_not_found;   # невалидно → заглушка с 404
        rewrite ^ /index.html last;            # валидно → SPA, 200
    }

    # Отдаём React-shell со статусом 404 (краулер видит 404, юзер — заглушку NotFound)
    location @spa_not_found {
        return 404;
    }
    # error_page БЕЗ «=» сохраняет исходный код (404), но телом отдаёт index.html
    error_page 404 /index.html;

    # ── Внутренние локейшены для проверки слага ──

    # njs-валидатор: делает subrequest'ы к бэкенду и возвращает 204 (валидно) / 404 (нет)
    location = /__validate_slug {
        internal;
        js_content spa.validateSlug;
    }

    # Внутренний прокси к API бэкенда (njs ходит сюда). Поменяйте адрес на свой.
    location /__be/ {
        internal;
        proxy_pass https://test.maxiscomfort.ru/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host test.maxiscomfort.ru;
        proxy_set_header Accept application/json;
    }
}
